[package]
name = "dev-env-manager"
version = "0.1.0"
description = "开发环境管理工具 (Tauri)"
authors = ["DevEnvManager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
