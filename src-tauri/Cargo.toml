[package]
name = "dev-env-manager"
version = "0.2.0-beta"
description = "开发环境管理工具 (Tauri)"
authors = ["DevEnvManager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
thiserror = "2"
dirs = "6"
chrono = "0.4"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "devenv"
path = "src/bin/devenv.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
