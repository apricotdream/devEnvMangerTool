[package]
name = "dev-env-manager"
version = "0.2.4-beta"
description = "开发环境管理工具 (Tauri)"
authors = ["DevEnvManager"]
edition = "2021"
default-run = "dev-env-manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# GUI 壳：启用 core 的 gui feature（含 tauri 命令层）。
devenv-core = { path = "../core", features = ["gui"] }
tauri = { version = "2", features = [] }
# 直接依赖：tauri-build 在构建期校验 capabilities（dialog:default）时需要能发现该插件。
tauri-plugin-dialog = "2"
serde_json = "1"
